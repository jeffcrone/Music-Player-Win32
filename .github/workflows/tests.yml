# Builds Music Player and runs the full test suite.
#
# Runs on every push to main, on every pull request targeting main (when it
# is opened and on every update), and by hand from the Actions tab.
#
# Pull requests get a comment saying whether the tests passed. Later runs
# edit that same comment rather than adding a new one.
#
# NOTE on fork pull requests: GitHub gives workflows triggered from a fork a
# read-only token, so the "comment" job cannot post there (it fails with
# "Resource not accessible by integration"). The tests themselves still run
# and their result still shows on the PR's checks list.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      # Let both architectures finish so one failure doesn't hide the other.
      fail-fast: false
      matrix:
        include:
          # 32-bit, msvcrt.dll: the build that runs on Windows XP and later.
          - arch: x86
            msystem: MINGW32
            packages: >-
              mingw-w64-i686-gcc
              mingw-w64-i686-cmake
              mingw-w64-i686-ninja
          # 64-bit, msvcrt.dll: runs on 64-bit XP and later. It also runs the
          # icon generator's tests, which need Python and Pillow (MSYS2 does
          # not package Pillow for 32-bit).
          - arch: x64
            msystem: MINGW64
            packages: >-
              mingw-w64-x86_64-gcc
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-ninja
              mingw-w64-x86_64-python
              mingw-w64-x86_64-python-pillow
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.packages }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # The playback tests skip themselves (they need a sound card, which CI
      # machines lack); everything else, including the Windows XP import
      # check, runs for real.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  comment:
    name: Report on the pull request
    needs: test
    # always(): report failures too, not only successes.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          # "success", "failure" or "cancelled" (GitHub's spelling).
          RESULT: ${{ needs.test.result }}
        with:
          script: |
            // A hidden marker identifies our comment so later runs can find
            // and edit it instead of piling up new ones.
            const marker = '<!-- music-player-test-results -->';
            const result = process.env.RESULT;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const headline = {
              success: '✅ **Tests passed**',
              failure: '❌ **Tests failed**',
              cancelled: '⚪ **Tests were canceled**',
            }[result] || `⚠️ **Tests did not complete** (${result})`;
            const body = `${marker}\n${headline} for ${sha} (x86 and x64 builds).\n\n[Run details](${runUrl})`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
